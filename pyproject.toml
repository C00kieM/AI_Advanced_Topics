[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-ai"
version = "0.1.0"
description = "Lokaler Wetter-KI-MVP mit InfluxDB, DWD API, regelbasiertem Chat, CLI und FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pywebview>=5.0",
  "typer>=0.12",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
weather-chat = "weather_ai.cli:main"
weather-gui = "weather_ai.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weather_ai = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
